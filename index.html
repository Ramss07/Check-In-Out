<!DOCTYPE html>
<html>
<head>
  <title>CCI Makerspace Equipment Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 300px;
      padding: 8px;
      font-size: 14px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>CCI Makerspace Equipment Check-In/Out</h2>
  <form id="checkForm">
    <label for="equipmentId">Equipment ID:</label>
    <input type="text" name="equipmentId" required />

    <label for="studentId">Student ID:</label>
    <input type="text" name="studentId" required />

    <label for="notes">Additional Notes (optional):</label>
    <textarea name="notes" rows="4"></textarea>

    <button type="submit">Submit</button>
  </form>

  <script>
    const SHEET_URL = "https://api.sheetbest.com/sheets/7f7803f3-decb-4b0d-8a50-c34f6c98a9d2";

    document.getElementById('checkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const equipmentId = form.equipmentId.value.trim();
      const studentId = form.studentId.value.trim();
      const notes = form.notes.value.trim();
      const timestamp = new Date().toISOString();

      try {
        // 1. See if this item is already checked out
        const queryURL = `${SHEET_URL}?Equipment%20ID=${equipmentId}&Student%20ID=${studentId}&Status=Checked%20Out`;
        const response = await fetch(queryURL);
        const data = await response.json();

        if (data.length > 0) {
          // Already checked out —> check in
          const row = data[0];
          const rowId = row._id; // This is auto-generated by Sheet.best for updating

          const updateResponse = await fetch(`${SHEET_URL}/${rowId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "Status": "Checked In",
              "Checked In Time": timestamp
            })
          });

          if (!updateResponse.ok) throw new Error("Failed to check in");

          alert("✅ Equipment successfully checked in.");
        } else {
          // Not found —> check out
          const createResponse = await fetch(SHEET_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "Checked Out Time": timestamp,
              "Equipment ID": equipmentId,
              "Student ID": studentId,
              "Additional Notes": notes,
              "Status": "Checked Out",
              "Checked In Time": ""
            })
          });

          if (!createResponse.ok) throw new Error("Failed to check out");

          alert("✅ Equipment successfully checked out.");
        }

        form.reset();
      } catch (error) {
        alert("❌ Error: " + error.message);
      }
    });
  </script>
</body>
</html>
