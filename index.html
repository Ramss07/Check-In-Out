<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNCC • CCI Equipment Check‑In / Check‑Out</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:#046A38;
      --gold:#B58500;
      --green-600:#08502C;
      --bg:#f7faf8;
      --card:#ffffff;
      --ink:#162217;
      --muted:#5d6b64;
      --shadow: 0 10px 25px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      color:var(--ink);
      display:flex; justify-content:center; padding:32px;
    }
    .wrap{width:100%; max-width:960px}

    header{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
    .crest{
      width:52px;height:52px;border-radius:12px;
      background:linear-gradient(135deg,var(--green),var(--green-600));
      display:grid;place-items:center;color:#fff;font-weight:700;
      box-shadow: var(--shadow);
    }
    .brand h1{margin:0;font-size:1.75rem;font-weight:800;}

    .card{
      background:var(--card);border-radius:18px;box-shadow:var(--shadow);
      overflow:hidden;border:1px solid rgba(4,106,56,.06);
    }
    .bar{height:6px;background:linear-gradient(90deg,var(--green),var(--gold));}

    form{
      padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;
    }
    @media(max-width:700px){form{grid-template-columns:1fr}}

    .field{display:flex;flex-direction:column;gap:8px;}
    label{font-weight:700;font-size:.95rem;}
    input,textarea,select{
      width:100%;padding:12px 14px;border:1px solid #d7e1db;border-radius:10px;
      background:#fff;font-size:1rem;
    }
    input:focus,textarea:focus,select:focus{
      outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(4,106,56,.25);
    }
    textarea{min-height:110px;resize:vertical}

    .seg{
      grid-column:1/-1;display:flex;gap:8px;align-items:center;
      background:#f1f6f3;border:1px solid #d7e1db;padding:8px;border-radius:12px;
    }
    .seg button{
      flex:1;border:0;border-radius:10px;background:#fff;color:var(--ink);
      padding:12px 14px;font-weight:800;cursor:pointer;
      box-shadow: inset 0 0 0 1px #d7e1db;
    }
    .seg button[aria-pressed="true"]{
      background:linear-gradient(135deg,var(--green),var(--green-600));
      color:#fff;box-shadow:none;
    }
    .seg small{color:var(--muted);font-weight:600}

    .actions{
      grid-column:1/-1;display:flex;gap:12px;justify-content:flex-end;padding-top:6px;
    }
    .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;}
    .btn.primary{background:linear-gradient(135deg,var(--gold),#d9a326);color:#1a1202;}
    .btn.secondary{background:#eef3f0;color:var(--ink);}

    .hint{grid-column:1/-1;margin-top:-6px;color:var(--muted);font-size:.95rem;}

    /* Big overlay feedback */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.55);
      display:none;align-items:center;justify-content:center;z-index:99;
    }
    .overlay.show{display:flex;animation:fadeIn .2s ease-out;}
    .overlay .msg{
      background:#fff;padding:30px 40px;border-radius:20px;text-align:center;
      font-weight:800;font-size:1.5rem;max-width:350px;color:var(--green);
      box-shadow: var(--shadow);
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="crest">CCI</div>
      <div class="brand">
        <h1>UNCC • CCI Equipment Check‑In / Check‑Out</h1>
      </div>
    </header>

    <div class="card">
      <div class="bar"></div>

      <form id="checkForm" novalidate>
        <div class="seg" role="group" aria-label="Select status">
          <button type="button" id="btnOut" aria-pressed="true" data-value="Check Out">Check Out</button>
          <button type="button" id="btnIn" aria-pressed="false" data-value="Check In">Check In</button>
          <small>Choose an action, then fill the fields.</small>
          <input type="hidden" name="status" id="status" value="Check Out" />
        </div>

        <div class="field">
          <label for="equipmentId">Equipment ID</label>
          <input type="text" id="equipmentId" name="equipmentId" required placeholder="e.g., CAM‑1234"/>
        </div>

        <div class="field">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" name="studentId" required placeholder="e.g., 800123456"/>
        </div>

        <div class="field" style="grid-column:1/-1">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" name="notes" placeholder="Condition, accessories, location, etc."></textarea>
        </div>

        <p class="hint">Use a barcode scanner in the Equipment ID field for quicker processing.</p>

        <div class="actions">
          <button type="button" class="btn secondary" id="resetBtn">Clear</button>
          <button type="submit" class="btn primary" id="submitBtn">Submit</button>
        </div>
      </form>
    </div>

    <div class="footer" style="margin-top:14px;text-align:center;color:#5d6b64;font-size:.9rem;">
      © CCI • UNC Charlotte
    </div>
  </div>

  <!-- Big Success Overlay -->
  <div class="overlay" id="overlay">
    <div class="msg" id="overlayMsg">✅ Submitted Successfully!</div>
  </div>

  <script>
    const API = 'https://api.sheetbest.com/sheets/7f7803f3-decb-4b0d-8a50-c34f6c98a9d2';

    const btnOut = document.getElementById('btnOut');
    const btnIn  = document.getElementById('btnIn');
    const statusInput = document.getElementById('status');
    function setStatus(val){
      statusInput.value = val;
      btnOut.setAttribute('aria-pressed', String(val==='Check Out'));
      btnIn.setAttribute('aria-pressed',  String(val==='Check In'));
    }
    btnOut.addEventListener('click',()=>setStatus('Check Out'));
    btnIn.addEventListener('click',()=>setStatus('Check In'));

    document.getElementById('resetBtn').addEventListener('click',()=>{
      document.getElementById('checkForm').reset();
      setStatus('Check Out');
    });

    const form = document.getElementById('checkForm');
    const overlay = document.getElementById('overlay');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      if(!form.reportValidity())return;
      submitBtn.disabled=true;submitBtn.textContent='Submitting…';

      const fd=new FormData(form);const now=new Date().toLocaleString();
      const status=fd.get('status');
      const payload={
        "Checked Out Time": status==="Check Out"?now:"",
        "Equipment ID": fd.get('equipmentId')??"",
        "Student ID": fd.get('studentId')??"",
        "Additional Notes": fd.get('notes')??"",
        "Status": status,
        "Checked In Time": status==="Check In"?now:""
      };

      try{
        const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(!res.ok) throw new Error('Network error');

        overlay.classList.add('show');
        setTimeout(()=>overlay.classList.remove('show'),2500);

        form.reset();setStatus('Check Out');
      }catch(err){
        overlay.querySelector('#overlayMsg').textContent='❌ Submission Failed!';
        overlay.classList.add('show');
        setTimeout(()=>{overlay.classList.remove('show');overlay.querySelector('#overlayMsg').textContent='✅ Submitted Successfully!';},2500);
      }finally{
        submitBtn.disabled=false;submitBtn.textContent='Submit';
      }
    });
  </script>
</body>
</html>
